{% extends "base.html" %}

{% block title %}Register — Speedoo{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
  <div class="card">
    <h2 style="margin-bottom: 0.5rem; text-align: center;">Create Speedoo Account</h2>
    <p style="color: var(--text-secondary); text-align: center; margin-bottom: 1.5rem; font-size: 0.95rem;">
      Register to participate in live typing competitions and rank on global leaderboards.
    </p>

    <form method="POST" action="{{ url_for('auth.register', next=request.args.get('next')) }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" value="{{ username or '' }}" required autofocus placeholder="e.g. speed_demon" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" value="{{ email or '' }}" required placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required placeholder="Minimum 6 characters" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="Re-enter password" autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
        Register Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
      Already have an account? <a href="{{ url_for('auth.login', next=request.args.get('next')) }}" style="color: var(--accent); font-weight: 600;">Log In</a>
    </div>
  </div>
</div>
{% endblock %}
