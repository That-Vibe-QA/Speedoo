{% extends "base.html" %}

{% block title %}Log In — Speedoo{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
  <div class="card">
    <h2 style="margin-bottom: 0.5rem; text-align: center;">Log In to Speedoo</h2>
    <p style="color: var(--text-secondary); text-align: center; margin-bottom: 1.5rem; font-size: 0.95rem;">
      Enter your credentials to enter organized competitions.
    </p>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label class="form-label" for="identifier">Username or Email</label>
        <input type="text" id="identifier" name="identifier" class="form-control" required autofocus placeholder="Enter your username or email" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required placeholder="Enter password" autocomplete="current-password">
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer; color: var(--text-secondary);">
          <input type="checkbox" name="remember" value="1"> Remember me
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">
        Log In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
      Don't have an account yet? <a href="{{ url_for('auth.register', next=request.args.get('next')) }}" style="color: var(--accent); font-weight: 600;">Register</a>
    </div>
  </div>
</div>
{% endblock %}
