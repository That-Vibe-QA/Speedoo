{% extends "base.html" %}
{% block title %}Page Not Found (404) — Speedoo{% endblock %}
{% block content %}
<div class="card" style="text-align: center; max-width: 500px; margin: 3rem auto; padding: 3rem 1.5rem;">
  <h1 style="color: var(--accent); font-size: 3rem; margin-bottom: 0.5rem;">404</h1>
  <h2>Page Not Found</h2>
  <p style="color: var(--text-secondary); margin: 1rem 0 1.5rem;">
    The page or competition you are looking for does not exist or has been moved.
  </p>
  <a href="{{ url_for('practice.index') }}" class="btn btn-primary">Return to Practice</a>
</div>
{% endblock %}
