{% extends "base.html" %}
{% block title %}Server Error (500) — Speedoo{% endblock %}
{% block content %}
<div class="card" style="text-align: center; max-width: 500px; margin: 3rem auto; padding: 3rem 1.5rem;">
  <h1 style="color: var(--warning); font-size: 3rem; margin-bottom: 0.5rem;">500</h1>
  <h2>Server Error</h2>
  <p style="color: var(--text-secondary); margin: 1rem 0 1.5rem;">
    An unexpected error occurred while processing your request. Please try again later.
  </p>
  <a href="{{ url_for('practice.index') }}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
